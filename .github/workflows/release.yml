name: Release plugin

on:
  push:
    branches: [main]

concurrency:
  group: release-plugin
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: |
          npm test
          npm run build

      - name: Read version
        id: version
        run: echo "value=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release already exists: $VERSION"
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest release build
        if: steps.existing.outputs.released != 'true'
        uses: actions/attest@v4
        with:
          subject-path: main.js

      - name: Create release
        if: steps.existing.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          assets=(main.js manifest.json)
          if [ -f styles.css ]; then assets+=(styles.css); fi
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            "${assets[@]}"
